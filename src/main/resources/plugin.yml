name: AshStore
version: '${project.version}'
main: me.neoblade298.ashstore.AshStore
api-version: '1.21'
depend: [NeoCore]
commands:
  ashstore:
    description: Open the AshStore or manage AshCoins
    aliases: [store, ashcoins]
    permission: ashstore.use
permissions:
  ashstore.use:
    description: Allows opening the store
    default: true
  ashstore.balance:
    description: Allows viewing your AshCoins balance
    default: true
  ashstore.admin:
    description: Grants all AshStore administrative permissions
    default: op
    children:
      ashstore.admin.coins: true
      ashstore.admin.reload: true
  ashstore.admin.coins:
    description: Allows giving, taking, and setting player AshCoins
    default: false
  ashstore.admin.reload:
    description: Allows reloading AshStore configuration and categories
    default: false
