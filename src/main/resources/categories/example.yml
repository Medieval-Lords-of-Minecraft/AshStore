# Each file in this folder is one store category. The file name (without extension)
# is the category id. Set slot to place the category in the store inventory (0-53).
# Categories without a slot fill empty spaces automatically. If categories share a
# slot, the one with the lower priority is shown (default priority: 10).
# Set size to 18, 27, 36, 45, or 54 inventory slots (default 54). The final row
# is reserved for navigation, so the remaining slots contain category items.
#
# icon:  base64: "<texture>"  -> rendered as a skull (SkullUtil)
#        material: STONE      -> rendered as that material
#        (neither)            -> defaults to STONE
#
# slot: inventory slot from 0-44; omitted slots are filled automatically
# priority: lower values win when visible items share a slot (default 10)
# purchasable: false makes an informational icon with no price or click action (default true)
# view-permission: only players with this permission will see the item
# negate-permission: players with this permission will not see the item
# owned-permission: players with this permission see "Owned" and cannot purchase the item
#
# Item placeholders in commands: %player%, %uuid%
#
# Optional details menus use keyed groups under details.groups. Group slots are
# 0-44 and may be omitted for automatic placement. The back and purchase buttons
# accept slots 0-53 and default to 45 and 49. Every purchase is confirmed with a
# native Paper dialog, whether or not the item has a details menu.

name: "<gold>Example Category"
size: 54
slot: 10
priority: 10
icon:
  material: CHEST

items:
  example_rank:
    name: "<green>Example Rank"
    price: 1000
    slot: 10
    priority: 1
    permission: ashstore.buy.example
    owned-permission: ashstore.owned.example
    lore:
      - "<gray>An example purchasable rank."
      - "<dark_gray>Click to view all perks."
    icon:
      material: DIAMOND
    commands:
      - "say %player% purchased the Example Rank!"
    details:
      title: "<gold>Example Rank Perks"
      groups:
        homes:
          name: "<yellow>Homes & Travel"
          slot: 10
          icon:
            material: COMPASS
          lore:
            - "<gray>- Set up to <white>10 homes"
            - "<gray>- Access to <white>/back"
            - "<gray>- Shorter teleport delay"

        cosmetics:
          name: "<light_purple>Cosmetics"
          slot: 12
          icon:
            material: FIREWORK_ROCKET
          lore:
            - "<gray>- Exclusive particle effects"
            - "<gray>- Colored private messages"

      purchase:
        slot: 49
        name: "<green>Purchase Example Rank"
        icon:
          material: LIME_CONCRETE

      back:
        slot: 45

  starter_kit:
    name: "<aqua>Starter Kit"
    price: 250
    slot: 12
    priority: 2
    lore:
      - "<gray>A handy starter kit to get going."
    icon:
      material: CHEST
    commands:
      - "give %player% oak_log 16"
      - "give %player% bread 8"
