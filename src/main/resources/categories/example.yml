# Each file in this folder is one store category. The file name (without extension)
# is the category id. Categories are shown alphabetically by their display name.
#
# icon:  base64: "<texture>"  -> rendered as a skull (SkullUtil)
#        material: STONE      -> rendered as that material
#        (neither)            -> defaults to STONE
#
# slot: inventory slot from 0-44; omitted slots are filled automatically
# priority: lower values win when visible items share a slot (default 10)
# purchasable: false makes an informational icon with no price or click action (default true)
# view-permission: only players with this permission will see the item
# negate-permission: players with this permission will not see the item
#
# To replace a shop item after purchase, give it negate-permission and add a
# non-purchasable item in the same slot with the matching view-permission.
# Item placeholders in commands: %player%, %uuid%

name: "<gold>Example Category"
icon:
  material: CHEST

items:
  example_rank:
    name: "<green>Example Rank"
    price: 1000
    slot: 10
    priority: 1
    permission: ashstore.buy.example
    lore:
      - "<gray>An example purchasable rank."
    icon:
      material: DIAMOND
    commands:
      - "say %player% purchased the Example Rank!"

  starter_kit:
    name: "<aqua>Starter Kit"
    price: 250
    slot: 12
    priority: 2
    lore:
      - "<gray>A handy starter kit to get going."
    icon:
      material: CHEST
    commands:
      - "give %player% oak_log 16"
      - "give %player% bread 8"
